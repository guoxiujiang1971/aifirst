name: AIHandy
options:
  bundleIdPrefix: com.guoxj
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  aifirst:
    type: application
    platform: macOS
    sources:
      - path: Sources/aifirst
      - path: Sources/aifirst/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoxj.aifirst
        INFOPLIST_FILE: Sources/aifirst/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    # Info.plist 完全手动管理（含 NSServices、ATS 等自定义配置）
    # 修改配置时直接编辑 Sources/aifirst/Info.plist
    entitlements:
      path: Sources/aifirst/aifirst.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
